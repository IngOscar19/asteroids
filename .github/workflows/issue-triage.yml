name: Issue triage

# Triaje y formateo automático de issues.
# Usa el GITHUB_TOKEN efímero nativo de GitHub Actions para aplicar
# directamente el formato y las etiquetas al issue.

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Numero de issue a re-procesar"
        required: true
        type: string

# Permisos requeridos para leer código y actualizar issues
permissions:
  contents: read
  issues: write

# Un issue a la vez: evita que dos corridas se peleen por el mismo archivo.
concurrency:
  group: issue-triage-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  triage:
    if: >-
      (github.event_name == 'issues' &&
       github.event.issue.user.type != 'Bot' &&
       github.actor != 'github-actions[bot]') ||
      (github.event_name == 'issue_comment' &&
       github.event.comment.user.type != 'Bot' &&
       contains(github.event.comment.body, '/triage')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TRIAGE_DIR: ${{ github.workspace }}/.triage
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Tests de la logica de triaje
        run: node --test .github/scripts/triage.test.mjs

      - name: Resolver version de opencode
        id: oc-version
        run: |
          version=$(curl -sf https://api.github.com/repos/anomalyco/opencode/releases/latest \
            | grep -o '"tag_name": *"[^"]*"' | cut -d'"' -f4)
          echo "version=${version:-latest}" >> "$GITHUB_OUTPUT"

      - name: Cache de opencode
        id: oc-cache
        uses: actions/cache@v4
        with:
          path: ~/.opencode/bin
          key: opencode-${{ runner.os }}-${{ runner.arch }}-${{ steps.oc-version.outputs.version }}

      - name: Instalar opencode
        if: steps.oc-cache.outputs.cache-hit != 'true'
        run: curl -fsSL https://opencode.ai/install | bash

      - name: Agregar opencode al PATH
        run: echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      # Lee el issue, clasifica por reglas, arma el mapa de archivos y el prompt.
      # Escribe .triage/{issue,rules}.json y prompt.txt.
      - name: Recolectar datos y clasificar por reglas
        run: node .github/scripts/triage.mjs collect

      # Opcional: análisis con opencode
      - name: Analizar con opencode
        id: ai
        continue-on-error: true
        timeout-minutes: 5
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_DISABLE_AUTOUPDATE: "true"
        run: |
          set +e
          opencode run \
            --format json \
            --model opencode/big-pickle \
            --agent plan \
            --title "Triage issue #${{ github.event.issue.number || inputs.issue_number }}" \
            "$(cat "$TRIAGE_DIR/prompt.txt")" > "$TRIAGE_DIR/ai.jsonl" 2> "$TRIAGE_DIR/ai.log"
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "--- ultimas lineas de ai.log ---"
          tail -n 30 "$TRIAGE_DIR/ai.log" || true
          echo "exit_code=$code"

      # Aplica el bloque formateado y las labels directamente en el issue y en el resumen del run.
      - name: Aplicar formato y labels al issue
        run: node .github/scripts/triage.mjs report --apply

      - name: Subir la propuesta como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: triage-${{ github.event.issue.number || inputs.issue_number }}
          path: ${{ env.TRIAGE_DIR }}
          retention-days: 14
          if-no-files-found: warn
